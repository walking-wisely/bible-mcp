[package]
name = "bible-mcp"
version = "0.1.1"
edition = "2021"

[lib]
name = "bible_mcp"
path = "src/lib.rs"

[[bin]]
name = "bible-mcp"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["full"] }
rmcp         = { version = "3.8", features = ["client", "server", "macros", "transport-io", "transport-child-process", "transport-streamable-http-server"] }
rusqlite     = { version = "0.31", features = ["bundled"] }
sqlite-vec   = "0.1"
usearch      = "2.26"
libloading   = "0.9"
fastembed    = { version = "5", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }
reqwest      = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
clap         = { version = "4", features = ["derive"] }
indicatif    = "0.17"
strsim       = "0.11"
dirs         = "5"
sha2         = "0.10"
anyhow       = "1"
axum         = "0.8"

[dev-dependencies]
tempfile   = "3"
rusqlite   = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1"
